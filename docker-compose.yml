name: isg-multi-tenant

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-risk_analiz}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli — kök .env dosyasına ekle}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL gerekli — kök .env dosyasına ekle}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli — kök .env dosyasına ekle}
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE gerekli — kök .env dosyasına ekle (true|false)}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:?COOKIE_SAMESITE gerekli — kök .env dosyasına ekle (lax|strict|none)}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - /app/.venv
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "3000:3000"
      - "80:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  mongo_data:
  frontend_node_modules:
  uploads_data:
