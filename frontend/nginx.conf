server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # proxy_pass target is the ``BACKEND_UPSTREAM`` env var, expanded
        # by nginx's official entrypoint ``envsubst`` at container start.
        # Local docker-compose default (baked in the Dockerfile) =
        # ``http://backend:8000`` (in-network service name) so the proxy
        # actually forwards inside compose.
        #
        # Railway's documented split-host mode sets this to a startup-safe
        # placeholder (e.g. ``http://127.0.0.1:9999``); the React bundle
        # calls the absolute backend origin baked at ``npm run build`` time
        # via ``REACT_APP_BACKEND_URL``, so the /api/ proxy itself is
        # dormant and never serves Railway browser traffic. The placeholder
        # exists ONLY so nginx can resolve an upstream name at startup.
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
