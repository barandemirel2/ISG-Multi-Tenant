<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ABCD Tech Solutions İSG dekoratif arka plan">
  <title>ABCD Tech Solutions İSG — Risk Analiz Sistemi</title>

  <!-- Dark matte base (master prompt §2: #0B0F17) -->
  <rect width="800" height="600" fill="#0B0F17"/>

  <!-- Subtle grid pattern (Linear style, opacity 0.4 to stay subtle) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E242B" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-fine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#141B2D" stroke-width="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid-fine)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.6"/>

  <!-- Diagonal accent line (Linear 1px micro-border equivalent) -->
  <line x1="0" y1="540" x2="800" y2="500" stroke="#1E242B" stroke-width="1" opacity="0.6"/>

  <!-- Vertical risk accent (Sanzo deep madder crimson, low opacity) -->
  <line x1="40" y1="0" x2="40" y2="600" stroke="#8B263E" stroke-width="2" opacity="0.35"/>

  <!-- Large shield accent (right, very subtle — no decorative clutter rule) -->
  <g transform="translate(560 100)" opacity="0.05" fill="#8B263E">
    <path d="M 100 0 L 200 50 L 200 150 Q 200 250 100 300 Q 0 250 0 150 L 0 50 Z"/>
  </g>
  <g transform="translate(560 100)" opacity="0.04" fill="none" stroke="#FFFFFF" stroke-width="4">
    <path d="M 60 150 L 90 180 L 150 100"/>
  </g>

  <!-- Small grid markers (top right, Risk Score style) -->
  <g transform="translate(620 80)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#94A3B8" opacity="0.4">
    <text x="0" y="0">/</text>
    <text x="0" y="14">84 SORU</text>
    <text x="0" y="28">9 ALAN</text>
  </g>

  <!-- Bottom-left brand mark area (subtle, master prompt flat) -->
  <g transform="translate(40 540)" font-family="ui-sans-serif, system-ui" fill="#94A3B8" opacity="0.5">
    <text x="0" y="0" font-size="11" font-weight="600" letter-spacing="0.5">ABCD Tech Solutions</text>
    <text x="0" y="16" font-size="9" letter-spacing="0.3">İSG — İŞ SAĞLIĞI VE GÜVENLİĞİ</text>
  </g>

  <!-- Top-right counter (KPI hint, low opacity) -->
  <g transform="translate(680 50)" font-family="ui-monospace, SFMono-Regular, monospace" fill="#94A3B8" opacity="0.35">
    <text x="0" y="0" font-size="9">v1.0 — UI/UX</text>
    <text x="0" y="14" font-size="9">2026-08</text>
  </g>
</svg>
